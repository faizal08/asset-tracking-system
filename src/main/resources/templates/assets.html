<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Asset Tracking Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Update extension to .jpg or .png based on your actual file in /static */
            background: url('/dashboard.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        h2 {
            margin-top: 0;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 210, 255, 0.5);
            padding-bottom: 15px;
            color: #00d2ff;
        }

        /* Form Section Styling */
        .form-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-section h4 {
            margin-top: 0;
            color: #51cf66;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        input, select {
            padding: 12px;
            margin-right: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            color: white;
            outline: none;
        }

        option {
            background: #1a1a1a; /* Dark background for dropdown options */
            color: white;
        }

        .btn-add {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-add:hover {
            background-color: #218838;
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.4);
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            padding: 15px;
            background: rgba(0, 210, 255, 0.2);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-edit {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            margin-right: 15px;
        }

        .btn-del {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: bold;
        }

        /* Logout Positioning */
        .logout-link {
            float: right;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 69, 69, 0.4);
        }
    </style>
</head>
<body>
<div class="container">
    <form th:action="@{/auth/logout}" method="post" class="logout-link">
        <button type="submit" class="logout-btn">Logout</button>
    </form>

    <h2>📦 Asset Management Center</h2>

    <div class="form-section">
        <h4>Register New Hardware</h4>
        <form th:action="@{/assets-ui/add}" th:object="${newAsset}" method="post">
            <input type="text" th:field="*{name}" placeholder="Asset Name" required />
            <input type="text" th:field="*{type}" placeholder="Type (Laptop/Server)" required />
            <select th:field="*{status}">
                <option value="Available">Available</option>
                <option value="Assigned">Assigned</option>
                <option value="Maintenance">Maintenance</option>
            </select>
            <button type="submit" class="btn-add">Deploy Asset</button>
        </form>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Type</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="asset : ${assets}">
            <td th:text="${asset.id}"></td>
            <td><input type="text" th:id="'name-' + ${asset.id}" th:value="${asset.name}" style="width:150px;"></td>
            <td th:text="${asset.type}"></td>
            <td>
                <select th:id="'status-' + ${asset.id}">
                    <option value="Available" th:selected="${asset.status == 'Available'}">Available</option>
                    <option value="Assigned" th:selected="${asset.status == 'Assigned'}">Assigned</option>
                    <option value="Maintenance" th:selected="${asset.status == 'Maintenance'}">Maintenance</option>
                </select>
            </td>
            <td>
                <a href="javascript:void(0)" class="btn-edit" th:onclick="'patchAsset(' + ${asset.id} + ')'">Update</a>

                <a th:href="@{'/assets-ui/delete/' + ${asset.id}}" class="btn-del"
                   onclick="return confirm('Initiate Soft-Delete? Data will remain in vault but exit visibility.')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    async function patchAsset(id) {
        const nameValue = document.getElementById('name-' + id).value;
        const statusValue = document.getElementById('status-' + id).value;

        const response = await fetch('/assets/' + id, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name: nameValue,
                status: statusValue
            })
        });

        if (response.ok) {
            alert('Protocol Updated: Asset ' + id + ' modified via PATCH.');
            location.reload();
        } else {
            alert('Update Failed.');
        }
    }
</script>
</body>
</html>

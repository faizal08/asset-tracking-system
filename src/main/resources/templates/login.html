<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 100px; }
        form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input { display: block; margin-bottom: 10px; padding: 8px; width: 200px; }
        button { width: 100%; padding: 8px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<form th:action="@{/auth/login}" method="post">
    <h3>Asset System Login</h3>
    <div th:if="${param.error}" style="color:red">Invalid credentials.</div>
    <div th:if="${param.logout}" style="color:green">Logged out successfully.</div>
    <input type="text" name="username" placeholder="Username (admin)" required>
    <input type="password" name="password" placeholder="Password (admin123)" required>
    <button type="submit">Login</button>
</form>
</body>
</html>
